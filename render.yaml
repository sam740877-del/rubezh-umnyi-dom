# Развёртывание «Учёта СКИ» на Render — стенд для показа заказчику.
#
# Почему файл здесь, а не рядом с проектом
# -----------------------------------------
#
# Render читает `render.yaml` ТОЛЬКО из корня репозитория. Сам проект
# лежит в подпапке `ski-uchet/` (в этом репозитории живёт ещё и страница
# про умный дом), поэтому у каждой службы указан `rootDir`: он говорит
# Render, из какой папки собирать и запускать.
#
# Копия этого файла лежит и в `ski-uchet/render.yaml` — она описывает
# то же самое для случая, когда проект вынесут в отдельный репозиторий.
# Правя одну, правьте обе, иначе они разойдутся.
#
# Что здесь развёрнуто
# ---------------------
#
# Две части, и обе смотрят в ОДНУ базу — в этом весь смысл стенда:
#
#   1. `ski-uchet-demo`    — сайт И бот в MAX (бот потоком внутри);
#   2. `ski-uchet-demo-db` — база PostgreSQL.
#
# Бот не отдельной службой потому, что на бесплатном тарифе Render
# фоновых служб нет — см. пояснение у `SKI_BOT_INLINE` ниже.
#
# Пока база была файловой (SQLite на диске службы), бот мог работать
# только на компьютере разработчика: файл по сети не открыть. Заказчик
# видел сайт, но проверить связку «нажал в боте — изменилось на сайте»
# не мог. С общей базой обе части живут на площадке, и показ не зависит
# от того, включён ли чей-то компьютер.
#
# ТОЛЬКО ДЛЯ ПОКАЗА. Боевая установка идёт на сервер конторы, внутри
# локальной сети (docs/ROADMAP.md, этап 2): серверы Render за рубежом,
# а в системе будут ФИО сотрудников, и хранить персональные данные
# россиян за границей нельзя.
#
# Про бесплатный тариф: база живёт 30 дней, потом Render её удаляет.
# Службы засыпают после четверти часа без обращений — первая страница
# и первый ответ бота после простоя идут около минуты.

databases:
  - name: ski-uchet-demo-db
    databaseName: ski_uchet
    user: ski_uchet
    plan: free
    region: frankfurt

services:
  # ------------------------------------------------------------------
  # Сайт: кладовщик, главный инженер, администратор
  # ------------------------------------------------------------------
  - type: web
    name: ski-uchet-demo
    runtime: python
    plan: free
    region: frankfurt
    rootDir: ski-uchet

    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run

    envVars:
      - key: SKI_DATABASE_URL
        fromDatabase:
          name: ski-uchet-demo-db
          property: connectionString

      # Демонстрационные данные наливаются на ПУСТУЮ базу и только на неё
      # (см. `manage.py`, `_seed_demo_if_asked`): иначе повторное
      # развёртывание затирало бы то, что заказчик успел наработать.
      - key: SKI_SEED_DEMO
        value: "1"

      # Ключ подписи сеансов. Render создаёт его сам и держит в секрете:
      # в исходниках такому значению не место.
      - key: SKI_SECRET_KEY
        generateValue: true

      # Бот MAX поднимается ПОТОКОМ РЯДОМ С САЙТОМ, а не отдельной службой.
      #
      # Правильнее отдельной: опрос MAX держит соединение открытым
      # десятками секунд, и мешать этим страницам незачем. Так и сделано
      # на сервере конторы, и так работает `manage.py bot` у себя.
      #
      # Но на бесплатном тарифе Render фоновых служб НЕТ: развёртывание
      # 08.09.2026 отклонило `type: worker` с «service type is not
      # available for this plan». А стенд нужен именно затем, чтобы
      # заказчик увидел связку «нажал в боте — изменилось на сайте».
      - key: SKI_BOT_INLINE
        value: "1"

      # Токен бота. `sync: false` означает: значение задаётся руками
      # в панели Render и в репозиторий не попадает. Попав в чужие руки,
      # токен отдаёт бота целиком — об этом предупреждает документация MAX.
      - key: MAX_BOT_TOKEN
        sync: false

      # Без этого Render берёт самую свежую версию Python (3.14), с которой
      # SQLAlchemy 2.0.36 несовместим: развёртывание падало с «descriptor
      # '__getitem__' requires a 'typing.Union' object but received a 'tuple'».
      - key: PYTHON_VERSION
        value: "3.12.10"

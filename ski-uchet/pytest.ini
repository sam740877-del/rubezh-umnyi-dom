[pytest]
# Метки для выборочного прогона. Проставляются автоматически по имени
# файла — см. tests/conftest.py. Гонять всё подряд при правке одной
# страницы незачем: прогон, который идёт две минуты, перестают звать,
# и сторожа теряют смысл.
markers =
    core: правила учёта — без веба и браузера
    web: страницы, формы, права на маршрутах
    guard: сторожа устройства — слои, миграции, секреты
    slow: заметно долгие, гонять отдельно

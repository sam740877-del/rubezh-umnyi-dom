# Развёртывание на Render — ТОЛЬКО ДЛЯ ПОКАЗА ЗАКАЗЧИКУ.
#
# Боевая установка идёт на сервер конторы, внутри локальной сети
# (см. docs/ROADMAP.md, этап 2). Здесь — демонстрационный стенд
# с выдуманными данными.
#
# Почему не боевая установка: серверы Render за рубежом, а в системе
# будут ФИО сотрудников. Хранить персональные данные россиян за границей
# нельзя — этот риск записан в плане с самого начала.

services:
  - type: web
    name: ski-uchet-demo
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run

    envVars:
      # Демонстрационные данные наливаются при первом запуске: диск на
      # бесплатном тарифе пересоздаётся при каждом развёртывании, и без
      # этого заказчик увидел бы пустые экраны.
      - key: SKI_SEED_DEMO
        value: "1"

      # Ключ подписи сеансов. Render создаёт его сам и держит в секрете:
      # в исходниках такому значению не место.
      - key: SKI_SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.12.10"
